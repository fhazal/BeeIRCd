# Builds the BeeIRCd Docker image for amd64 and arm64, tests it on both
# (arm64 emulated: setup, start, status, IRC), and only then pushes it.
#   main          -> ghcr.io/fhazal/beeircd:edge (version "<next>-dev")
#   tag v1.2.3    -> :1.2.3 :1.2 :1 :latest, version 1.2.3 (a tag with a dash,
#                    like v1.3.0-rc1, gets only its own tag)
# Release images are built like release.yml builds the programs; when the
# release's release.json is already public the programs must match it byte
# for byte. Rebuild an old release with: gh workflow run docker.yml -f tag=v1.0.0
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "cmd/**"
      - "internal/**"
      - "deploy/docker/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build, like v1.0.0 (empty = this branch as edge)"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: version and image tags
        env:
          TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
        run: |
          sha="$(git rev-parse --short=7 HEAD)"
          img=ghcr.io/fhazal/beeircd
          if [ -n "$TAG" ]; then
            v="${TAG#v}"
            tags="-t $img:$v"
            case "$v" in
            *-*) ;;
            *) tags="$tags -t $img:${v%.*} -t $img:${v%%.*} -t $img:latest" ;;
            esac
          else
            v=1.0.1-dev
            tags="-t $img:edge -t $img:sha-$sha"
          fi
          { echo "TAG=$TAG"; echo "VERSION=$v"; echo "SHA=$sha"; echo "IMAGE_TAGS=$tags"; } >> "$GITHUB_ENV"
          echo "version $v, commit $sha, tags: $tags"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build linux amd64 + arm64
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/fhazal/beeircd/internal/version.Version=$VERSION -X github.com/fhazal/beeircd/internal/version.Commit=$SHA" \
              -o dist/beeircd-linux-$arch ./cmd/beeircd
          done
      - name: release programs match the published release.json
        if: env.TAG != ''
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/release.json"
          if ! curl -fsSL -o release.json "$url"; then
            echo "no public release.json yet (draft): skipping the byte check"
            exit 0
          fi
          for arch in amd64 arm64; do
            want="$(python3 -c "import json; print(json.load(open('release.json'))['files']['beeircd-linux-$arch'])")"
            got="$(sha256sum dist/beeircd-linux-$arch | cut -d' ' -f1)"
            echo "$arch release $want built $got"
            [ "$want" = "$got" ] || { echo "the image program differs from the signed release"; exit 1; }
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build and test each platform
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform linux/$arch -f deploy/docker/Dockerfile --load -t beeircd-smoke:$arch .
            bash deploy/docker/smoke.sh beeircd-smoke:$arch linux/$arch
          done
          docker image ls beeircd-smoke
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: push ${{ env.IMAGE_TAGS }}
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -f deploy/docker/Dockerfile --push \
            --label org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY} \
            --label org.opencontainers.image.description="BeeIRCd IRC server with services and the Hive Panel" \
            --label org.opencontainers.image.licenses=AGPL-3.0-or-later \
            $IMAGE_TAGS .
