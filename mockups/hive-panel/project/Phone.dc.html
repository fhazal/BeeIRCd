      <div style="display: flex; justify-content: space-between; gap: 10px; padding: 8px 0"><span style="font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; display: flex; gap: 8px; align-items: center"><span style="width: 8px; height: 8px; border-radius: 50%; background: #5fd38d"></span>leaf2.beenet.org</span><span style="color: #a9b0bc">3 ms</span></div>

    <section style="padding: 16px; border-radius: 12px; background: #161a21; border: 1px solid #232833; display: flex; flex-direction: column; gap: 8px">

      <div style="display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid #232833; font-size: 14px"><span style="color: #8a92a0">21:42</span><span>leaf2.beenet.org linked</span></div>
      <div style="display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; padding: 7px 0; font-size: 14px"><span style="color: #8a92a0">21:31</span><span>Network ban on *@203.0.113.*</span></div>
