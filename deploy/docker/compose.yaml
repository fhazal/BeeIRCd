# BeeIRCd with Docker Compose. Save this file in an empty folder, then:
#
#   docker compose run --rm beeircd install    # the nine questions
#   docker compose up -d                       # start (and after every reboot)
#
# Hive Panel too (if you said yes to it):  add  --profile panel
# BeeRoom web chat too:                    add  --profile chat
#   for example  docker compose --profile panel --profile chat up -d
# How it runs:       docker compose exec beeircd beeircd status
# Update:            docker compose pull && docker compose up -d
# Everything (config, accounts, channels, backups) is in the beeircd-data volume.
services:
  beeircd:
    image: ghcr.io/fhazal/beeircd:1
    init: true
    restart: unless-stopped
    ports:
      - "6667:6667"     # plain; remove if you answered "6697" only
      - "6697:6697"     # TLS
      # - "7000:7000"   # link port: a hub (or a leaf its hub connects to)
      # - "80:80"       # Let's Encrypt asks through port 80
    volumes:
      - beeircd-data:/data
      - beeircd-run:/run/beeircd
      - beeroom-link:/link
    environment:
      TZ: UTC           # the daily backup runs at 04:00 in this time zone
      BEEROOM_WEBIRC: 10.89.0.20   # BeeRoom's address below: its WEBIRC gateway
    networks:
      - bee

  beeircd-web:
    image: ghcr.io/fhazal/beeircd:1
    profiles: ["panel"]
    init: true
    restart: unless-stopped
    command: web
    ports:
      - "127.0.0.1:8787:8787"   # this machine only: reach it with an SSH tunnel
    volumes:
      - beeircd-data:/data
      - beeircd-run:/run/beeircd
    depends_on:
      - beeircd
    networks:
      - bee

  beeroom:
    image: ghcr.io/fhazal/beeroom:1
    profiles: ["chat"]
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"   # for the web server in front (see docs/INSTALL.md "Docker")
    volumes:
      - beeroom-data:/data
      - beeroom-link:/link:ro
    environment:
      BEEROOM_CHANNELS: "#lobby"   # channels a guest joins
      BEEROOM_PANEL: "http://127.0.0.1:8787"   # the Hive Panel's address: its Chat tab may show BeeRoom
    depends_on:
      - beeircd
    networks:
      bee:
        ipv4_address: 10.89.0.20

networks:
  bee:
    ipam:
      config:
        - subnet: 10.89.0.0/24   # change both 10.89.0 parts if this clashes with your network

volumes:
  beeircd-data:
  beeircd-run:
  beeroom-link:
  beeroom-data:
