# BeeIRCd test server on the homelab. Home network only:
# ports bound to the LAN address, no router or VPS forward.

[server]
name = "test.beenet.local"
network = "BeeNet"
description = "BeeIRCd test server"
sid = "0BE"

[[listen]]
address = "192.168.50.76:26667"

[[listen]]
address = "192.168.50.76:26697"
tls = true

[tls]
cert = "tls/cert.pem"
key = "tls/key.pem"
self_signed = true

[motd]
file = "motd.txt"

[services]
database = "services.db"

[cloak]
# The secret lives only on the homelab (made once with
# `openssl rand -hex 24`); deploy adds it to the copy there.
